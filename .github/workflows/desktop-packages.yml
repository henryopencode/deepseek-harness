name: Desktop Packages

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/desktop/**'
      - 'apps/cli/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'vendor/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: write

env:
  DESKTOP_RELEASE_TAG: v0.2.0

jobs:
  prepare-release:
    name: Prepare v0.2.0 release
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$DESKTOP_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$DESKTOP_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "DeepSeek Harness Desktop v0.2.0" \
              --notes "Electron desktop release with local speech-to-text for macOS Apple Silicon and Windows x64."

  package:
    name: ${{ matrix.name }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            platform: darwin
            arch: arm64
            artifact: DeepSeek-Harness-macos-arm64.zip
          - name: Windows x64
            os: windows-latest
            platform: win32
            arch: x64
            artifact: DeepSeek-Harness-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22.21.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm --filter @deepseek-ai/dsh-desktop run package -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$DESKTOP_RELEASE_TAG" release/${{ matrix.artifact }} --repo "$GITHUB_REPOSITORY" --clobber
